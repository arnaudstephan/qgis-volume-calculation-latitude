<!-- Volume calculation plugin icon: a stockpile on its triangulated (TIN) base -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f7cf8a"/>
      <stop offset="0.55" stop-color="#e09a48"/>
      <stop offset="1" stop-color="#b5652a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#5a2a08" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a2a08" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d9df2"/>
      <stop offset="1" stop-color="#1d5bbb"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,-6)">
  <!-- triangulated base (TIN) -->
  <path d="M2 43 L32 29 L62 43 L32 61 Z" fill="url(#base)" stroke="#123f86" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M2 43 L62 43 M32 29 L32 61 M17 50 L47 36 M47 52 L17 36 M17 50 L32 61 M47 52 L32 43"
        fill="none" stroke="#c4dcff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- stockpile (wide, low mound) -->
  <path d="M9 42 C13 33 20 19 32 17 C44 19 51 33 55 42 C48 48.5 16 48.5 9 42 Z"
        fill="url(#pile)" stroke="#7a3f12" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9 42 C13 33 20 19 32 17 C44 19 51 33 55 42 C48 48.5 16 48.5 9 42 Z" fill="url(#shade)"/>
  <!-- contour lines -->
  <path d="M12.6 35 C21 39.5 43 39.5 51.4 35" fill="none" stroke="#7a3f12" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M17.2 27.5 C24 31 40 31 46.8 27.5" fill="none" stroke="#7a3f12" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M23.5 21 C27.5 23 36.5 23 40.5 21" fill="none" stroke="#7a3f12" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
